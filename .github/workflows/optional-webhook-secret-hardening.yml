name: Optional webhook secret hardening

on:
  push:
    branches: [directly-usable-alpha]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: directly-usable-alpha
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Reject empty webhook secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/server/src/main.rs')
          text = path.read_text()
          old = '''    if let Some(secret) = configured {
              return Some(secret.to_vec());
          }
          '''
          new = '''    if let Some(secret) = configured {
              return (!secret.is_empty()).then(|| secret.to_vec());
          }
          '''
          if old not in text:
              raise SystemExit('configured webhook secret block not found')
          text = text.replace(old, new, 1)
          old = '''    credentials
              .get("webhookSecret")
              .and_then(Value::as_str)
              .map(|value| value.as_bytes().to_vec())
          '''
          new = '''    credentials
              .get("webhookSecret")
              .and_then(Value::as_str)
              .filter(|value| !value.is_empty())
              .map(|value| value.as_bytes().to_vec())
          '''
          if old not in text:
              raise SystemExit('stored webhook secret block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit hardening and remove one-shot workflow
        run: |
          git config user.name "NoPager CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/server/src/main.rs
          git rm .github/workflows/optional-webhook-secret-hardening.yml
          git commit -m "Reject empty optional webhook secrets"
          git push origin HEAD:directly-usable-alpha
