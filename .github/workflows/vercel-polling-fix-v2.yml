name: Vercel polling fix v2

on:
  push:
    branches: [directly-usable-alpha]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: directly-usable-alpha
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Apply robust polling fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/worker/src/main.rs')
          text = path.read_text()

          if 'failed to schedule Vercel polling fallback' not in text:
              pattern = r'(\s+if let Err\(error\) = database\.enqueue_due_health_checks\(100\)\.await \{\n\s+error!\(%error, "failed to schedule health checks"\);\n\s+\})'
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit('health scheduler block not found')
              addition = '''
                  if let Err(error) = database.enqueue_due_vercel_polls(100).await {
                      error!(%error, "failed to schedule Vercel polling fallback");
                  }'''
              text = text[:match.end()] + addition + text[match.end():]

          start = text.index('async fn process_vercel_poll(')
          end = text.index('async fn process_webhook(', start)
          process = '''async fn process_vercel_poll(database: &Database, payload: &Value) -> anyhow::Result<()> {
              let project_id: uuid::Uuid = required_string(payload, "projectId")?.parse()?;
              let vercel_project_id = required_string(payload, "vercelProjectId")?;
              let since_ms = payload
                  .get("sinceMs")
                  .and_then(Value::as_i64)
                  .ok_or_else(|| anyhow::anyhow!("sinceMs is missing"))?;
              let integration = database.integration_secret(project_id, "vercel").await?;
              let credentials = decrypt_credentials(&integration.encrypted_credentials)?;
              let token = required_string(&credentials, "token")?;
              let team_id = integration
                  .metadata
                  .get("teamId")
                  .and_then(Value::as_str)
                  .map(str::trim)
                  .filter(|value| !value.is_empty())
                  .map(ToOwned::to_owned);
              let client = VercelClient::new(SecretString::from(token.to_owned()), team_id)?;
              let deployments = client
                  .list_deployments_since(vercel_project_id, 20, Some(since_ms))
                  .await?;

              for deployment in deployments {
                  if deployment.target.as_deref() != Some("production") {
                      continue;
                  }
                  let state = deployment
                      .ready_state
                      .as_deref()
                      .or(deployment.state.as_deref())
                      .unwrap_or("UNKNOWN")
                      .to_owned();
                  let url = https_url(&deployment.url);
                  let sha = deployment
                      .meta
                      .get("githubCommitSha")
                      .and_then(Value::as_str)
                      .unwrap_or("unknown")
                      .to_owned();
                  database
                      .save_deployment(
                          project_id,
                          &deployment.id,
                          "production",
                          &sha,
                          &url,
                          &state,
                          false,
                      )
                      .await?;

                  if matches!(state.as_str(), "ERROR" | "CANCELED" | "CANCELLED") {
                      database
                          .open_incident(&IncidentTrigger {
                              project_id,
                              deduplication_key: format!("vercel-deployment:{}", deployment.id),
                              trigger_type: "VERCEL_DEPLOYMENT_FAILED".into(),
                              severity: "high".into(),
                              title: "Vercel production deployment failed".into(),
                              metadata: json!({
                                  "source": "vercel-poll",
                                  "deployment": {
                                      "id": deployment.id,
                                      "url": url,
                                      "target": deployment.target,
                                      "state": state,
                                      "created": deployment.created,
                                      "meta": deployment.meta
                                  }
                              }),
                          })
                          .await?;
                  }
              }
              Ok(())
          }

          '''
          text = text[:start] + process + text[end:]
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name "NoPager CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/worker/src/main.rs
          git rm .github/workflows/vercel-polling-fix.yml .github/workflows/vercel-polling-fix-v2.yml
          git commit -m "Fix Vercel polling scheduler and deployment ownership"
          git push origin HEAD:directly-usable-alpha
