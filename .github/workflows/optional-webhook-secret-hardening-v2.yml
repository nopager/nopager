name: Optional webhook secret hardening v2

on:
  push:
    branches: [directly-usable-alpha]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: directly-usable-alpha
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Replace webhook secret resolver with fail-closed implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/server/src/main.rs')
          text = path.read_text()
          start = text.index('async fn webhook_secret(')
          end = text.index('async fn accept_webhook(', start)
          replacement = '''async fn webhook_secret(state: &ServerState, kind: &str) -> Option<Vec<u8>> {
              let configured = match kind {
                  "github" => &state.github_webhook_secret,
                  "vercel" => &state.vercel_webhook_secret,
                  _ => return None,
              };
              if let Some(secret) = configured {
                  return (!secret.is_empty()).then(|| secret.to_vec());
              }
              let database = state.database.as_ref()?;
              let cipher = state.secret_cipher.as_ref()?;
              let integration = database.single_integration_secret(kind).await.ok()??;
              let plaintext = cipher.decrypt(&integration.encrypted_credentials).ok()?;
              let credentials: Value = serde_json::from_str(plaintext.expose_secret()).ok()?;
              credentials
                  .get("webhookSecret")
                  .and_then(Value::as_str)
                  .filter(|value| !value.is_empty())
                  .map(|value| value.as_bytes().to_vec())
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --all
          git diff --check
      - name: Commit hardening and remove temporary workflows
        run: |
          git config user.name "NoPager CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/server/src/main.rs
          git rm .github/workflows/optional-webhook-secret-hardening.yml .github/workflows/optional-webhook-secret-hardening-v2.yml
          git commit -m "Fail closed when optional webhook secret is empty"
          git push origin HEAD:directly-usable-alpha
