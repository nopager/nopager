name: Prepare model discovery route

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/provider-model-discovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Normalize provider route for one-shot transform
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/server/src/main.rs')
          text = path.read_text()
          old = '''        .route(
            "/api/v1/setup/test/provider",
            post(test_provider_connection),
        )
        .route("/api/v1/setup/test/health", post(test_health_connection))
'''
          new = '''        .route("/api/v1/setup/test/provider", post(test_provider_connection))
        .route("/api/v1/setup/test/health", post(test_health_connection))
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected multiline provider route once, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/main.rs
          git commit -m "Prepare provider model discovery transform"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
