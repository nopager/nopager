name: Fix model discovery transform

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/provider-model-discovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix provider route insertion matcher once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-model-discovery.yml')
          text = path.read_text()
          old = '''              server,
              ''' + "'''" + '''        .route(\"/api/v1/setup/test/provider\", post(test_provider_connection))\\n        .route(\"/api/v1/setup/test/health\", post(test_health_connection))\\n''' + "'''" + ''',
              ''' + "'''" + '''        .route(\"/api/v1/setup/test/provider\", post(test_provider_connection))\\n        .route(\\n            \"/api/v1/setup/models\",\\n            post(discover_provider_models),\\n        )\\n        .route(\"/api/v1/setup/test/health\", post(test_health_connection))\\n''' + "'''" + ''',
              'provider model discovery route',
          )'''
          new = '''              server,
              ''' + "'''" + '''        .route(\\n            \"/api/v1/setup/test/provider\",\\n            post(test_provider_connection),\\n        )\\n''' + "'''" + ''',
              ''' + "'''" + '''        .route(\\n            \"/api/v1/setup/test/provider\",\\n            post(test_provider_connection),\\n        )\\n        .route(\\n            \"/api/v1/setup/models\",\\n            post(discover_provider_models),\\n        )\\n''' + "'''" + ''',
              'provider model discovery route',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected old route transform once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-model-discovery.yml
          git commit -m "Fix model discovery route transform"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
