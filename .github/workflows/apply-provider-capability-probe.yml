name: Apply provider capability probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/provider-capability-probe' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply capability probe
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected once, found {count}')
              path.write_text(text.replace(old, new, 1))

          lib = Path('crates/nopager-providers/src/lib.rs')
          replace_once(
              lib,
              '''    #[error("configured model is not available to this provider account: {0}")]\n    ModelUnavailable(String),\n''',
              '''    #[error("configured model is not available to this provider account: {0}")]\n    ModelUnavailable(String),\n    #[error("selected model failed NoPager's structured-output capability probe ({model}): {reason}")]\n    CapabilityProbeFailed { model: String, reason: String },\n''',
              'provider capability error',
          )

          http = Path('crates/nopager-providers/src/http.rs')
          replace_once(
              http,
              '''const MAX_DISCOVERED_MODELS: usize = 200;\n''',
              '''const MAX_DISCOVERED_MODELS: usize = 200;\nconst CAPABILITY_PROBE_MAX_OUTPUT_TOKENS: u64 = 1024;\nconst CAPABILITY_PROBE_SYSTEM_PROMPT: &str = "This is a NoPager setup capability probe. Return only the requested structured JSON and set ok to true.";\n''',
              'capability constants',
          )
          replace_once(
              http,
              '''#[derive(Clone, Copy)]\nenum Backend {\n    OpenAi,\n    Anthropic,\n    Gemini,\n}\n''',
              '''#[derive(Clone, Copy)]\nenum Backend {\n    OpenAi,\n    Anthropic,\n    Gemini,\n}\n\n#[derive(serde::Deserialize)]\nstruct CapabilityProbe {\n    ok: bool,\n}\n''',
              'capability response type',
          )
          replace_once(
              http,
              '''    async fn test_connection(&self) -> Result<(), ProviderError> {\n        let models = self.list_models().await?;\n        if models.iter().any(|model| model.id == self.model) {\n            Ok(())\n        } else {\n            Err(ProviderError::ModelUnavailable(self.model.clone()))\n        }\n    }\n\n    async fn list_models(&self) -> Result<Vec<AvailableModel>, ProviderError> {\n''',
              '''    async fn test_connection(&self) -> Result<(), ProviderError> {\n        let models = self.list_models().await?;\n        if !models.iter().any(|model| model.id == self.model) {\n            return Err(ProviderError::ModelUnavailable(self.model.clone()));\n        }\n        self.capability_probe().await\n    }\n\n    async fn capability_probe(&self) -> Result<(), ProviderError> {\n        let probe: CapabilityProbe = self\n            .structured_with_config(\n                "capability_probe",\n                capability_probe_schema(),\n                json!({ "probe": "nopager_setup" }),\n                CAPABILITY_PROBE_SYSTEM_PROMPT,\n                Some(CAPABILITY_PROBE_MAX_OUTPUT_TOKENS),\n            )\n            .await\n            .map_err(|error| match error {\n                ProviderError::Authentication => ProviderError::Authentication,\n                other => ProviderError::CapabilityProbeFailed {\n                    model: self.model.clone(),\n                    reason: other.to_string(),\n                },\n            })?;\n        if probe.ok {\n            Ok(())\n        } else {\n            Err(ProviderError::CapabilityProbeFailed {\n                model: self.model.clone(),\n                reason: "provider returned ok=false".to_owned(),\n            })\n        }\n    }\n\n    async fn list_models(&self) -> Result<Vec<AvailableModel>, ProviderError> {\n''',
              'capability connection test',
          )
          replace_once(
              http,
              '''    async fn structured<T: DeserializeOwned>(\n        &self,\n        name: &str,\n        schema: Value,\n        mut input: Value,\n    ) -> Result<T, ProviderError> {\n        sanitize_model_value(&mut input);\n        let prompt = format!(\n            "Return the requested {name} for this incident input:\\n{}",\n            serde_json::to_string(&input).map_err(|_| ProviderError::Decode)?\n        );\n        let response = match self.backend {\n            Backend::OpenAi => {\n                let body = json!({\n                    "model": self.model,\n                    "instructions": SYSTEM_PROMPT,\n                    "input": prompt,\n                    "text": { "format": { "type": "json_schema", "name": name, "strict": true, "schema": schema } }\n                });\n                decode_json(\n                    self.request(Method::POST, "responses")?\n                        .json(&body)\n                        .send()\n                        .await\n                        .map_err(request_error)?,\n                )\n                .await?\n            }\n            Backend::Anthropic => {\n                let body = json!({\n                    "model": self.model,\n                    "max_tokens": 8192,\n                    "system": SYSTEM_PROMPT,\n                    "messages": [{ "role": "user", "content": prompt }],\n                    "output_config": { "format": { "type": "json_schema", "schema": schema } }\n                });\n                decode_json(\n                    self.request(Method::POST, "messages")?\n                        .json(&body)\n                        .send()\n                        .await\n                        .map_err(request_error)?,\n                )\n                .await?\n            }\n            Backend::Gemini => {\n                let body = json!({\n                    "systemInstruction": { "parts": [{ "text": SYSTEM_PROMPT }] },\n                    "contents": [{ "role": "user", "parts": [{ "text": prompt }] }],\n                    "generationConfig": { "responseMimeType": "application/json", "responseJsonSchema": schema }\n                });\n                let path = format!("v1beta/models/{}:generateContent", self.model);\n                decode_json(\n                    self.request(Method::POST, &path)?\n                        .json(&body)\n                        .send()\n                        .await\n                        .map_err(request_error)?,\n                )\n                .await?\n            }\n        };\n        let text = extract_text(self.backend, &response)?;\n        serde_json::from_str(text).map_err(|_| ProviderError::Decode)\n    }\n''',
              '''    async fn structured<T: DeserializeOwned>(\n        &self,\n        name: &str,\n        schema: Value,\n        input: Value,\n    ) -> Result<T, ProviderError> {\n        self.structured_with_config(name, schema, input, SYSTEM_PROMPT, None)\n            .await\n    }\n\n    async fn structured_with_config<T: DeserializeOwned>(\n        &self,\n        name: &str,\n        schema: Value,\n        mut input: Value,\n        system_prompt: &str,\n        max_output_tokens: Option<u64>,\n    ) -> Result<T, ProviderError> {\n        sanitize_model_value(&mut input);\n        let prompt = format!(\n            "Return the requested {name} for this input:\\n{}",\n            serde_json::to_string(&input).map_err(|_| ProviderError::Decode)?\n        );\n        let body = self.structured_request_body(\n            name,\n            schema,\n            &prompt,\n            system_prompt,\n            max_output_tokens,\n        );\n        let response = match self.backend {\n            Backend::OpenAi => {\n                decode_json(\n                    self.request(Method::POST, "responses")?\n                        .json(&body)\n                        .send()\n                        .await\n                        .map_err(request_error)?,\n                )\n                .await?\n            }\n            Backend::Anthropic => {\n                decode_json(\n                    self.request(Method::POST, "messages")?\n                        .json(&body)\n                        .send()\n                        .await\n                        .map_err(request_error)?,\n                )\n                .await?\n            }\n            Backend::Gemini => {\n                let path = format!("v1beta/models/{}:generateContent", self.model);\n                decode_json(\n                    self.request(Method::POST, &path)?\n                        .json(&body)\n                        .send()\n                        .await\n                        .map_err(request_error)?,\n                )\n                .await?\n            }\n        };\n        let text = extract_text(self.backend, &response)?;\n        serde_json::from_str(text).map_err(|_| ProviderError::Decode)\n    }\n\n    fn structured_request_body(\n        &self,\n        name: &str,\n        schema: Value,\n        prompt: &str,\n        system_prompt: &str,\n        max_output_tokens: Option<u64>,\n    ) -> Value {\n        match self.backend {\n            Backend::OpenAi => {\n                let mut body = json!({\n                    "model": self.model,\n                    "instructions": system_prompt,\n                    "input": prompt,\n                    "text": { "format": { "type": "json_schema", "name": name, "strict": true, "schema": schema } }\n                });\n                if let Some(max_output_tokens) = max_output_tokens {\n                    body["max_output_tokens"] = json!(max_output_tokens);\n                }\n                body\n            }\n            Backend::Anthropic => json!({\n                "model": self.model,\n                "max_tokens": max_output_tokens.unwrap_or(8192),\n                "system": system_prompt,\n                "messages": [{ "role": "user", "content": prompt }],\n                "output_config": { "format": { "type": "json_schema", "schema": schema } }\n            }),\n            Backend::Gemini => {\n                let mut generation_config = json!({\n                    "responseMimeType": "application/json",\n                    "responseJsonSchema": schema\n                });\n                if let Some(max_output_tokens) = max_output_tokens {\n                    generation_config["maxOutputTokens"] = json!(max_output_tokens);\n                }\n                json!({\n                    "systemInstruction": { "parts": [{ "text": system_prompt }] },\n                    "contents": [{ "role": "user", "parts": [{ "text": prompt }] }],\n                    "generationConfig": generation_config\n                })\n            }\n        }\n    }\n''',
              'structured request capability config',
          )
          replace_once(
              http,
              '''fn diagnosis_schema() -> Value {\n''',
              '''fn capability_probe_schema() -> Value {\n    json!({\n        "type": "object",\n        "additionalProperties": false,\n        "properties": {\n            "ok": { "type": "boolean" }\n        },\n        "required": ["ok"]\n    })\n}\n\nfn diagnosis_schema() -> Value {\n''',
              'capability schema',
          )
          replace_once(
              http,
              '''    #[test]\n    fn strict_schemas_reject_extra_fields() {\n''',
              '''    #[test]\n    fn capability_probe_uses_the_runtime_structured_output_path_with_a_small_budget() {\n        let schema = capability_probe_schema();\n        for backend in [Backend::OpenAi, Backend::Anthropic, Backend::Gemini] {\n            let provider = HttpProvider::new(\n                backend,\n                SecretString::from("test-key".to_owned()),\n                "test-model".to_owned(),\n                Url::parse("https://example.com/").unwrap(),\n            )\n            .unwrap();\n            let body = provider.structured_request_body(\n                "capability_probe",\n                schema.clone(),\n                "Return ok=true",\n                CAPABILITY_PROBE_SYSTEM_PROMPT,\n                Some(CAPABILITY_PROBE_MAX_OUTPUT_TOKENS),\n            );\n            assert_eq!(body["model"], "test-model");\n            match backend {\n                Backend::OpenAi => {\n                    assert_eq!(body["max_output_tokens"], CAPABILITY_PROBE_MAX_OUTPUT_TOKENS);\n                    assert_eq!(body["text"]["format"]["type"], "json_schema");\n                    assert_eq!(body["text"]["format"]["strict"], true);\n                }\n                Backend::Anthropic => {\n                    assert_eq!(body["max_tokens"], CAPABILITY_PROBE_MAX_OUTPUT_TOKENS);\n                    assert_eq!(body["output_config"]["format"]["type"], "json_schema");\n                }\n                Backend::Gemini => {\n                    assert_eq!(\n                        body["generationConfig"]["maxOutputTokens"],\n                        CAPABILITY_PROBE_MAX_OUTPUT_TOKENS\n                    );\n                    assert_eq!(\n                        body["generationConfig"]["responseMimeType"],\n                        "application/json"\n                    );\n                    assert_eq!(\n                        body["generationConfig"]["responseJsonSchema"],\n                        schema\n                    );\n                }\n            }\n        }\n    }\n\n    #[test]\n    fn capability_probe_schema_requires_only_the_boolean_result() {\n        let schema = capability_probe_schema();\n        assert_eq!(schema["additionalProperties"], false);\n        assert_eq!(schema["required"], json!(["ok"]));\n        assert_eq!(schema["properties"]["ok"]["type"], "boolean");\n    }\n\n    #[test]\n    fn strict_schemas_reject_extra_fields() {\n''',
              'capability request tests',
          )

          server = Path('apps/server/src/main.rs')
          replace_once(
              server,
              '''use nopager_providers::{\n    AnthropicProvider, GeminiProvider, ModelProvider, OpenAiProvider, discover_available_models,\n};\n''',
              '''use nopager_providers::{\n    AnthropicProvider, GeminiProvider, ModelProvider, OpenAiProvider, ProviderError,\n    discover_available_models,\n};\n''',
              'provider error import',
          )
          replace_once(
              server,
              '''            Err(error) => {\n                tracing::warn!(%error, "model provider connection test failed");\n                api_error(\n                    StatusCode::UNPROCESSABLE_ENTITY,\n                    "provider_connection_failed",\n                )\n            }\n''',
              '''            Err(error) => {\n                tracing::warn!(%error, "model provider connection test failed");\n                api_error(\n                    StatusCode::UNPROCESSABLE_ENTITY,\n                    provider_connection_error_code(&error),\n                )\n            }\n''',
              'provider test error mapping',
          )
          replace_once(
              server,
              '''    if let Err(error) = provider.test_connection().await {\n        tracing::warn!(%error, "model provider setup connection test failed");\n        return api_error(\n            StatusCode::UNPROCESSABLE_ENTITY,\n            "provider_connection_failed",\n        )\n        .into_response();\n    }\n''',
              '''    if let Err(error) = provider.test_connection().await {\n        tracing::warn!(%error, "model provider setup connection test failed");\n        return api_error(\n            StatusCode::UNPROCESSABLE_ENTITY,\n            provider_connection_error_code(&error),\n        )\n        .into_response();\n    }\n''',
              'protect provider error mapping',
          )
          replace_once(
              server,
              '''fn connection_success() -> (StatusCode, Json<Value>) {\n    (StatusCode::OK, Json(json!({ "connected": true })))\n}\n''',
              '''fn connection_success() -> (StatusCode, Json<Value>) {\n    (StatusCode::OK, Json(json!({ "connected": true })))\n}\n\nfn provider_connection_error_code(error: &ProviderError) -> &'static str {\n    match error {\n        ProviderError::ModelUnavailable(_) => "provider_model_unavailable",\n        ProviderError::CapabilityProbeFailed { .. } => "provider_model_capability_failed",\n        _ => "provider_connection_failed",\n    }\n}\n''',
              'provider setup error helper',
          )

          page = Path('apps/web/app/setup/page.tsx')
          replace_once(
              page,
              '''  provider_models_empty:\n    "The provider connection worked but returned no usable models for this account. You can still enter a model ID manually.",\n''',
              '''  provider_models_empty:\n    "The provider connection worked but returned no usable models for this account. You can still enter a model ID manually.",\n  provider_model_unavailable:\n    "That model ID is not available to this provider account. Load available models or choose another exact model ID.",\n  provider_model_capability_failed:\n    "NoPager could not complete its structured-output capability check with this model. The model may not support the required API features, or the provider may have temporarily rejected the request. Try another model or retry once.",\n''',
              'capability setup errors',
          )
          replace_once(
              page,
              '''          repository is not uploaded as a prompt.\n        </SetupNote>\n''',
              '''          repository is not uploaded as a prompt. Loading the model list is\n          metadata-only. Test & continue sends a very small structured-output\n          capability probe through your provider account, and final setup may\n          repeat that check to fail closed before production protection starts.\n        </SetupNote>\n''',
              'capability billing note',
          )
          PY
      - name: Format and validate capability probe
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.92.0
          pnpm exec prettier --write apps/web/app/setup/page.tsx
          cargo fmt --all
          pnpm format:check
          pnpm lint
          pnpm typecheck
          cargo test -p nopager-providers -p nopager-server
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/nopager-providers/src/lib.rs \
            crates/nopager-providers/src/http.rs \
            apps/server/src/main.rs \
            apps/web/app/setup/page.tsx
          if git diff --cached --quiet; then
            echo "Capability probe product changes already committed"
            exit 0
          fi
          git commit -m "Probe provider structured-output capability"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
