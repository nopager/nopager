name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.92.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: sh -n scripts/quickstart.sh

  self-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure deterministic smoke environment
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path

          path = Path('.env')
          values = {
              'NOPAGER_MASTER_KEY': 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=',
              'NOPAGER_ADMIN_TOKEN': 'ci-smoke-operator-token',
              'NOPAGER_WEB_BIND': '127.0.0.1',
          }
          lines = path.read_text().splitlines()
          rendered = []
          seen = set()
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else None
              if key in values:
                  rendered.append(f'{key}={values[key]}')
                  seen.add(key)
              else:
                  rendered.append(line)
          for key, value in values.items():
              if key not in seen:
                  rendered.append(f'{key}={value}')
          path.write_text('\n'.join(rendered) + '\n')
          PY
      - name: Run user-facing quickstart
        run: sh scripts/quickstart.sh
      - name: Verify generated self-host secrets
        run: |
          password=$(awk -F= '$1 == "POSTGRES_PASSWORD" { sub(/^[^=]*=/, ""); print; exit }' .env)
          test -n "$password"
          test "$password" != "nopager"
          test "$(stat -c '%a' .env)" = "600"
          docker compose config --quiet
      - name: Verify application container hardening
        run: |
          for service in server worker web; do
            container=$(docker compose ps -q "$service")
            test -n "$container"
            test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = "true"
          done
      - name: Verify Docker network isolation
        run: |
          docker compose exec -T web node - <<'NODE'
          const net = require('node:net');
          let finished = false;
          const finish = (code) => {
            if (finished) return;
            finished = true;
            process.exit(code);
          };
          const socket = net.connect({ host: 'postgres', port: 5432 });
          socket.on('connect', () => finish(1));
          socket.on('error', () => finish(0));
          setTimeout(() => finish(0), 3000);
          NODE
      - name: Verify Rust setup API
        run: curl --fail --show-error --silent http://127.0.0.1:8080/api/v1/setup/status >/dev/null
      - name: Verify web console and API proxy
        run: |
          rm -f /tmp/nopager-proxy.headers
          curl --fail --show-error --silent http://127.0.0.1:3000/setup >/dev/null
          curl --fail --show-error --silent \
            -D /tmp/nopager-proxy.headers \
            http://127.0.0.1:3000/api/nopager/setup/status >/dev/null
          grep -qi '^cache-control:.*private.*no-store' /tmp/nopager-proxy.headers
          grep -qi '^pragma:.*no-cache' /tmp/nopager-proxy.headers
      - name: Verify operator bearer token
        run: |
          curl --fail --show-error --silent \
            -H 'authorization: Bearer ci-smoke-operator-token' \
            http://127.0.0.1:8080/api/v1/incidents >/dev/null
      - name: Reject cross-origin browser mutation
        run: |
          status=$(curl --silent --output /tmp/nopager-csrf.json --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'origin: https://attacker.example' \
            -X POST \
            --data '{"username":"admin","password":"correct-horse-battery-staple"}' \
            http://127.0.0.1:3000/api/nopager/setup/admin)
          test "$status" = "403"
          grep -q 'cross_origin_mutation_blocked' /tmp/nopager-csrf.json
      - name: Exercise first-admin bootstrap through web origin
        run: |
          rm -f /tmp/nopager.cookies /tmp/nopager.headers /tmp/nopager-status.json
          curl --fail --show-error --silent \
            -D /tmp/nopager.headers \
            -c /tmp/nopager.cookies \
            -H 'content-type: application/json' \
            -H 'origin: http://127.0.0.1:3000' \
            -X POST \
            --data '{"username":"admin","password":"correct-horse-battery-staple"}' \
            http://127.0.0.1:3000/api/nopager/setup/admin >/dev/null
          grep -qi 'httponly' /tmp/nopager.headers
          grep -qi 'samesite=strict' /tmp/nopager.headers
          grep -qi '^cache-control:.*private.*no-store' /tmp/nopager.headers
          curl --fail --show-error --silent \
            -b /tmp/nopager.cookies \
            http://127.0.0.1:3000/api/nopager/setup/status \
            -o /tmp/nopager-status.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/nopager-status.json').read_text())
          assert status['adminCreated'] is True
          assert status['authenticated'] is True
          assert status['appProtected'] is False
          PY
      - name: Show service status
        run: docker compose ps
      - name: Tear down smoke stack
        if: always()
        run: docker compose down -v --remove-orphans

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, self-host-smoke]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push architecture images
        env:
          IMAGE_TAG: sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          for service in server worker web; do
            image="ghcr.io/${{ github.repository_owner }}/nopager-${service}"
            docker build \
              --file "docker/${service}.Dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --tag "${image}:${IMAGE_TAG}" \
              .
            docker push "${image}:${IMAGE_TAG}"
          done

  publish-image-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish exact-revision multi-arch manifests
        run: |
          for service in server worker web; do
            image="ghcr.io/${{ github.repository_owner }}/nopager-${service}"
            docker buildx imagetools create \
              --tag "${image}:sha-${GITHUB_SHA}" \
              "${image}:sha-${GITHUB_SHA}-amd64" \
              "${image}:sha-${GITHUB_SHA}-arm64"
          done
