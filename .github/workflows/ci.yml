name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: sh -n scripts/quickstart.sh

  self-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure deterministic smoke environment
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('.env')
          values = {
              'NOPAGER_MASTER_KEY': 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=',
              'DOCKER_GID': str(os.stat('/var/run/docker.sock').st_gid),
              'NOPAGER_WEB_BIND': '127.0.0.1',
          }
          lines = path.read_text().splitlines()
          rendered = []
          seen = set()
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else None
              if key in values:
                  rendered.append(f'{key}={values[key]}')
                  seen.add(key)
              else:
                  rendered.append(line)
          for key, value in values.items():
              if key not in seen:
                  rendered.append(f'{key}={value}')
          path.write_text('\n'.join(rendered) + '\n')
          PY
      - run: docker compose config --quiet
      - run: docker compose build server worker web
      - name: Start self-hosted stack
        run: docker compose up -d
      - name: Wait for Rust API health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color server postgres
          exit 1
      - name: Verify Rust setup API
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8080/api/v1/setup/status >/dev/null || {
            docker compose ps --all
            docker compose logs --no-color server postgres
            exit 1
          }
      - name: Wait for web console
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/setup >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color web server
          exit 1
      - name: Verify web API proxy
        run: |
          curl --fail --show-error --silent http://127.0.0.1:3000/api/nopager/setup/status >/dev/null || {
            docker compose ps --all
            docker compose logs --no-color web server
            exit 1
          }
      - name: Exercise first-admin bootstrap through web origin
        run: |
          rm -f /tmp/nopager.cookies /tmp/nopager.headers /tmp/nopager-status.json
          curl --fail --show-error --silent \
            -D /tmp/nopager.headers \
            -c /tmp/nopager.cookies \
            -H 'content-type: application/json' \
            -X POST \
            --data '{"username":"admin","password":"correct-horse-battery-staple"}' \
            http://127.0.0.1:3000/api/nopager/setup/admin >/dev/null
          grep -qi 'httponly' /tmp/nopager.headers
          grep -qi 'samesite=strict' /tmp/nopager.headers
          curl --fail --show-error --silent \
            -b /tmp/nopager.cookies \
            http://127.0.0.1:3000/api/nopager/setup/status \
            -o /tmp/nopager-status.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/nopager-status.json').read_text())
          assert status['adminCreated'] is True
          assert status['authenticated'] is True
          assert status['appProtected'] is False
          PY
      - name: Show service status
        run: docker compose ps
      - name: Tear down smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
