name: Format setup once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format and commit setup page
        run: |
          pnpm exec prettier --write apps/web/app/setup/page.tsx
          if git diff --quiet -- apps/web/app/setup/page.tsx; then
            echo "Setup page already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/setup/page.tsx
          git commit -m "Format guided setup page"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
