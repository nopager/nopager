name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff for changed UI
        run: |
          pnpm exec prettier --write "apps/web/app/incidents/[id]/page.tsx" "apps/web/components/ui.tsx" "apps/web/lib/model.ts" "apps/web/lib/model.test.ts"
          git diff -- "apps/web/app/incidents/[id]/page.tsx" "apps/web/components/ui.tsx" "apps/web/lib/model.ts" "apps/web/lib/model.test.ts"
          git diff --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
