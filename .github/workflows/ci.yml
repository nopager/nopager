name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-partner-alpha
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply kill-switch resume hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          db_path = Path("crates/nopager-db/src/lib.rs")
          db = db_path.read_text()
          marker = "Protection resumed; restarting incident from fresh context"
          if marker not in db:
              start = db.index("    pub async fn set_protection_paused(")
              end = db.index("    #[allow(clippy::too_many_arguments)]", start)
              replacement = '''    pub async fn set_protection_paused(
                  &self,
                  paused: bool,
                  actor: &str,
              ) -> Result<u64, DatabaseError> {
                  let mut tx = self.pool.begin().await?;
                  let project_ids = sqlx::query_scalar::<_, Uuid>("UPDATE projects SET protection_paused = $1, updated_at = now() WHERE status = 'ACTIVE' AND protection_paused <> $1 RETURNING id")
                      .bind(paused).fetch_all(&mut *tx).await?;
                  for project_id in &project_ids {
                      insert_audit_event(
                          &mut tx,
                          *project_id,
                          None,
                          actor,
                          if paused {
                              "protection.pause"
                          } else {
                              "protection.resume"
                          },
                          &project_id.to_string(),
                          "success",
                          &serde_json::json!({}),
                      )
                      .await?;

                      if !paused {
                          let paused_incidents = sqlx::query_scalar::<_, Uuid>(
                              "SELECT id FROM incidents WHERE project_id = $1 AND status = 'PAUSED' ORDER BY opened_at FOR UPDATE",
                          )
                          .bind(project_id)
                          .fetch_all(&mut *tx)
                          .await?;
                          for incident_id in paused_incidents {
                              sqlx::query(
                                  "UPDATE repair_attempts SET status = 'PAUSED' WHERE id = (SELECT current_attempt_id FROM incidents WHERE id = $1)",
                              )
                              .bind(incident_id)
                              .execute(&mut *tx)
                              .await?;
                              let updated = sqlx::query(
                                  "UPDATE incidents SET status = 'COLLECTING_CONTEXT', current_attempt_id = NULL WHERE id = $1 AND status = 'PAUSED'",
                              )
                              .bind(incident_id)
                              .execute(&mut *tx)
                              .await?
                              .rows_affected();
                              if updated == 1 {
                                  insert_incident_event(
                                      &mut tx,
                                      incident_id,
                                      "STATE_CHANGED",
                                      actor,
                                      "Protection resumed; restarting incident from fresh context",
                                      &serde_json::json!({ "from": "PAUSED", "to": "COLLECTING_CONTEXT" }),
                                  )
                                  .await?;
                                  insert_audit_event(
                                      &mut tx,
                                      *project_id,
                                      Some(incident_id),
                                      actor,
                                      "incident.resume",
                                      &incident_id.to_string(),
                                      "success",
                                      &serde_json::json!({ "restartFrom": "COLLECTING_CONTEXT" }),
                                  )
                                  .await?;
                                  sqlx::query("INSERT INTO jobs (id, job_type, idempotency_key, correlation_id, payload_json, max_attempts) VALUES ($1, 'diagnose', $2, $3, $4, 3)")
                                      .bind(Uuid::now_v7())
                                      .bind(format!("incident:{incident_id}:resume-diagnose:{}", Uuid::now_v7()))
                                      .bind(incident_id)
                                      .bind(serde_json::json!({ "incidentId": incident_id }))
                                      .execute(&mut *tx)
                                      .await?;
                              }
                          }
                      }
                  }
                  tx.commit().await?;
                  Ok(project_ids.len() as u64)
              }

          '''
              db = db[:start] + replacement + db[end:]
              db_path.write_text(db)

          worker_path = Path("apps/worker/src/main.rs")
          worker = worker_path.read_text()
          if "Protection paused before sandbox validation or repository mutation" not in worker:
              start = worker.index("async fn process_build_test(")
              needle = '''    if attempt.incident_id != incident_id {
                  anyhow::bail!("repair attempt does not belong to the incident");
              }
          '''
              pos = worker.index(needle, start) + len(needle)
              addition = '''    if work.protection_paused {
                  database
                      .transition_incident(IncidentTransition {
                          project_id: work.project_id,
                          incident_id,
                          expected: work.state,
                          next: IncidentState::Paused,
                          actor: "worker".into(),
                          message: "Protection paused before sandbox validation or repository mutation".into(),
                          metadata: json!({}),
                      })
                      .await?;
                  return Ok(());
              }
          '''
              worker = worker[:pos] + addition + worker[pos:]

          if "Protection paused before creating the repair pull request" not in worker:
              start = worker.index("async fn process_build_test(")
              needle = '''    database
                  .save_validation(attempt_id, &Value::Array(validation.clone()), true)
                  .await?;
          '''
              pos = worker.index(needle, start) + len(needle)
              addition = '''
              work = database.incident_work(incident_id).await?;
              if work.protection_paused {
                  database
                      .transition_incident(IncidentTransition {
                          project_id: work.project_id,
                          incident_id,
                          expected: IncidentState::Testing,
                          next: IncidentState::Paused,
                          actor: "worker".into(),
                          message: "Protection paused before creating the repair pull request".into(),
                          metadata: json!({}),
                      })
                      .await?;
                  return Ok(());
              }
          '''
              worker = worker[:pos] + addition + worker[pos:]

          if "Protection paused before production mutation" not in worker:
              start = worker.index("async fn process_production_action(")
              old = '''    let work = database.incident_work(incident_id).await?;
              if work.protection_paused {
                  anyhow::bail!("production protection is paused");
              }
          '''
              pos = worker.index(old, start)
              new = '''    let work = database.incident_work(incident_id).await?;
              if work.protection_paused {
                  if work.state != IncidentState::Paused {
                      database
                          .transition_incident(IncidentTransition {
                              project_id: work.project_id,
                              incident_id,
                              expected: work.state,
                              next: IncidentState::Paused,
                              actor: "worker".into(),
                              message: "Protection paused before production mutation".into(),
                              metadata: json!({}),
                          })
                          .await?;
                  }
                  return Ok(());
              }
          '''
              worker = worker[:pos] + new + worker[pos + len(old):]

          worker_path.write_text(worker)
          PY
          cargo fmt --all
          if ! git diff --quiet -- crates/nopager-db/src/lib.rs apps/worker/src/main.rs; then
            git config user.name "NoPager CI"
            git config user.email "actions@users.noreply.github.com"
            git add crates/nopager-db/src/lib.rs apps/worker/src/main.rs
            git commit -m "Make kill switch pause and resume incidents safely"
            git push origin HEAD:design-partner-alpha
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
