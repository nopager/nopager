name: Apply provider model discovery

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/provider-model-discovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply saved model discovery transform
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          providers = Path('crates/nopager-providers/src/lib.rs')
          if 'pub async fn discover_available_models' in providers.read_text():
              print('Provider model discovery already applied')
              raise SystemExit(0)

          server = Path('apps/server/src/main.rs')
          text = server.read_text()
          multiline = '        .route(\n            "/api/v1/setup/test/provider",\n            post(test_provider_connection),\n        )\n        .route("/api/v1/setup/test/health", post(test_health_connection))\n'
          singleline = '        .route("/api/v1/setup/test/provider", post(test_provider_connection))\n        .route("/api/v1/setup/test/health", post(test_health_connection))\n'
          if text.count(multiline) == 1:
              server.write_text(text.replace(multiline, singleline, 1))
          elif text.count(singleline) != 1:
              raise SystemExit('provider setup route shape is not recognized')

          source = Path('.github/model-discovery-transform.source').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'model-discovery-transform', 'exec'), {'__name__': '__main__'})

          page = Path('apps/web/app/setup/page.tsx')
          rendered = page.read_text()
          rendered = rendered.replace('              setProviderModels([]);\n', '', 1)
          rendered = rendered.replace('            setProviderModels([]);\n', '', 1)
          page.write_text(rendered)

          http = Path('crates/nopager-providers/src/http.rs')
          rendered = http.read_text()
          rendered = rendered.replace(
              '        Backend::OpenAi | Backend::Anthropic => item.get("id"),\n        Backend::Gemini => item.get("name"),\n',
              '        Backend::OpenAi | Backend::Anthropic => {\n            item.get("id")\n        }\n        Backend::Gemini => item.get("name"),\n',
              1,
          )
          http.write_text(rendered)

          needle = 'let expected_auth = expected_auth.into();'
          matches = []
          for root in (Path('apps'), Path('crates')):
              for rust_file in root.rglob('*.rs'):
                  candidate = rust_file.read_text()
                  count = candidate.count(needle)
                  if count:
                      matches.extend([rust_file] * count)
          if len(matches) != 1:
              raise SystemExit(
                  f'expected exactly one transformed auth helper, found {len(matches)}: {matches}'
              )
          target = matches[0]
          rendered = target.read_text()
          target.write_text(
              rendered.replace(
                  needle,
                  'let expected_auth: secrecy::SecretString = expected_auth.into();',
                  1,
              )
          )
          print(f'fixed transformed auth helper in {target}')
          PY
      - name: Format and validate model discovery
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.92.0
          pnpm exec prettier --write apps/web/app/setup/page.tsx
          cargo fmt --all
          pnpm format:check
          pnpm lint
          pnpm typecheck
          cargo test -p nopager-providers -p nopager-server
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/nopager-providers/src/lib.rs \
            crates/nopager-providers/src/http.rs \
            apps/server/src/main.rs \
            apps/web/app/setup/page.tsx
          if git diff --cached --quiet; then
            echo "Model discovery product changes already committed"
            exit 0
          fi
          git commit -m "Discover provider models during setup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}