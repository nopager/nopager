name: Fix known-good rollback

on:
  push:
    branches: [directly-usable-alpha]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: directly-usable-alpha
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Remove ambiguous Vercel target shortcut
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/worker/src/main.rs')
          text = path.read_text()
          old = '''            let current = vercel.get_deployment(&known_good_id).await?;
            if current.target.as_deref() != Some("production") {
                vercel.rollback(vercel_project_id, &known_good_id).await?;
            }
          '''
          new = '''            // The known-good record is intentionally the deployment from before the
            // repair promotion. `target=production` only identifies its environment and
            // cannot prove that it is still serving the production domains. Always issue
            // the explicit rollback to the recorded known-good deployment.
            vercel.rollback(vercel_project_id, &known_good_id).await?;
          '''
          if old not in text:
              raise SystemExit('known-good rollback shortcut not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "NoPager CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/worker/src/main.rs
          git rm .github/workflows/fix-known-good-rollback.yml
          git commit -m "Always rollback to the recorded known-good deployment"
          git push origin HEAD:directly-usable-alpha
