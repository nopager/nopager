name: Require ready Vercel rollback baseline v2

on:
  push:
    branches: [directly-usable-alpha]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: directly-usable-alpha
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - name: Require READY production deployment during setup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/server/src/main.rs')
          text = path.read_text()

          if 'fn vercel_production_is_ready(' not in text:
              marker = 'fn optional_nonempty(value: &str) -> Option<String> {'
              helper = '''fn vercel_production_is_ready(deployment: &nopager_connectors::vercel::Deployment) -> bool {
              deployment.target.as_deref() == Some("production")
                  && matches!(
                      deployment.ready_state.as_deref().or(deployment.state.as_deref()),
                      Some("READY")
                  )
          }

          '''
              if marker not in text:
                  raise SystemExit('optional_nonempty marker not found')
              text = text.replace(marker, helper + marker, 1)

          pattern = re.compile(
              r'Ok\(deployments\)\s+if deployments\s*\.iter\(\)\s*\.any\(\|deployment\| deployment\.target\.as_deref\(\) == Some\("production"\)\)\s*=>'
          )
          text, count = pattern.subn('Ok(deployments) if deployments.iter().any(vercel_production_is_ready) =>', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one Vercel connection predicate, found {count}')

          old = '.find(|deployment| deployment.target.as_deref() == Some("production"))'
          if old not in text:
              raise SystemExit('initial deployment predicate not found')
          text = text.replace(old, '.find(vercel_production_is_ready)', 1)

          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit and remove temporary workflows
        run: |
          git config user.name "NoPager CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/server/src/main.rs
          git rm .github/workflows/require-ready-known-good.yml .github/workflows/require-ready-known-good-v2.yml
          git commit -m "Require READY Vercel deployment for rollback baseline"
          git push origin HEAD:directly-usable-alpha
