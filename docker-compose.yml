x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-read-only-app: &read-only-app
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: nopager
      POSTGRES_USER: nopager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopager"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nopager-postgres:/var/lib/postgresql/data
    networks:
      - backend

  server:
    <<: *read-only-app
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NOPAGER_SERVER_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgresql://nopager:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/nopager
      NOPAGER_MASTER_KEY: ${NOPAGER_MASTER_KEY:?set NOPAGER_MASTER_KEY}
      NOPAGER_ADMIN_TOKEN: ${NOPAGER_ADMIN_TOKEN:-}
      NOPAGER_COOKIE_SECURE: ${NOPAGER_COOKIE_SECURE:-false}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      VERCEL_WEBHOOK_SECRET: ${VERCEL_WEBHOOK_SECRET:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${NOPAGER_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend

  workspaces-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /workspaces"]
    network_mode: none
    logging: *default-logging
    volumes:
      - nopager-workspaces:/workspaces

  worker:
    <<: *read-only-app
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://nopager:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/nopager
      NOPAGER_MASTER_KEY: ${NOPAGER_MASTER_KEY:?set NOPAGER_MASTER_KEY}
      NOPAGER_AI_PROVIDER: ${NOPAGER_AI_PROVIDER:-openai}
      NOPAGER_AI_MODEL: ${NOPAGER_AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      NOPAGER_WORK_ROOT: /workspaces
      NOPAGER_SANDBOX_VOLUME: nopager-workspaces
      SANDBOX_UID_GID: ${SANDBOX_UID_GID:-10001:10001}
      SANDBOX_MAX_CPU: ${SANDBOX_MAX_CPU:-2}
      SANDBOX_MAX_MEMORY_MB: ${SANDBOX_MAX_MEMORY_MB:-4096}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-900}
      RUST_LOG: ${RUST_LOG:-info}
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nopager-workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      workspaces-init:
        condition: service_completed_successfully
    networks:
      - backend

  web:
    <<: *read-only-app
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      NOPAGER_API_URL: http://server:8080
    ports:
      - "${NOPAGER_WEB_BIND:-127.0.0.1}:${NOPAGER_WEB_PORT:-3000}:3000"
    depends_on:
      - server
    networks:
      - frontend

networks:
  frontend:
  backend:

volumes:
  nopager-postgres:
  nopager-workspaces:
    name: nopager-workspaces
