[workspace]
resolver = "2"
members = [
  "apps/server",
  "apps/worker",
  "apps/cli",
  "crates/nopager-core",
  "crates/nopager-policy",
  "crates/nopager-monitor",
  "crates/nopager-crypto",
  "crates/nopager-config",
  "crates/nopager-db",
  "crates/nopager-webhooks",
  "crates/nopager-providers",
  "crates/nopager-sandbox",
  "crates/nopager-connectors",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nopager/nopager"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
diffy = "0.5"
flate2 = "1.1"
http = "1.3"
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto", "use_pem"] }
hmac = "0.12"
hex = "0.4"
ipnet = "2.11"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "time", "migrate", "macros"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tar = "0.4"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }

[profile.release]
lto = "thin"
strip = "symbols"
